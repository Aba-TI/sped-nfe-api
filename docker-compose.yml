services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: sped-nfe-dev
    working_dir: /var/www/sped-nfe
    volumes:
      - ./:/var/www/sped-nfe
      - composer-cache:/tmp/composer/cache
      - ./docker/php/conf.d/custom.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    tty: true
    stdin_open: true
    command: bash

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: sped-nfe-api
    working_dir: /var/www/sped-nfe
    volumes:
      - ./:/var/www/sped-nfe
      - composer-cache:/tmp/composer/cache
      - ./docker/php/conf.d/custom.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    environment:
      API_PORT: ${API_PORT:-8080}
      API_ORIGIN_KEYS: ${API_ORIGIN_KEYS:-}
      API_KEY: ${API_KEY:-}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      NFE_CERT_PATH: ${NFE_CERT_PATH:-/var/www/sped-nfe/certs/certificado.pfx}
      NFE_CERT_PASSWORD: ${NFE_CERT_PASSWORD:-}
      NFE_TPAMB: ${NFE_TPAMB:-2}
      NFE_RAZAO_SOCIAL: ${NFE_RAZAO_SOCIAL:-EMPRESA NAO INFORMADA}
      NFE_CNPJ: ${NFE_CNPJ:-}
      NFE_SIGLA_UF: ${NFE_SIGLA_UF:-SP}
      NFE_SCHEMES: ${NFE_SCHEMES:-PL_009_V4}
      NFE_VERSAO: ${NFE_VERSAO:-4.00}
      NFE_VERAPLIC: ${NFE_VERAPLIC:-}
    ports:
      - "${API_PORT:-8080}:8080"
    command: php -S 0.0.0.0:8080 -t api/public api/router.php

volumes:
  composer-cache:
